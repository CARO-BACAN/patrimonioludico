<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ColecciónAR - Juego</title>

<!-- Tipografías de la marca: Saira (Títulos) y Lato (Textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Saira:wght@400;600;700;900&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Scripts de misiones y lógica del juego -->
  <script src="js/misiones.js"></script>
  <script src="js/juego.js" defer></script>

  <script>
    /* Componente de A-Frame para conectar MindAR directamente con la función del juego */
    AFRAME.registerComponent('detector-juego', {
      schema: { type: 'string' },
      init: function () {
        const nombreJuguete = this.data;

        this.el.addEventListener('targetFound', () => {
          if (typeof window.escaneoCorrecto === 'function') {
            window.escaneoCorrecto(nombreJuguete);
          }
        });
      }
    });
  </script>

  <style>

    :root {
      --fondo-papel: #EAE3D5;
      --azul-marino: #2A3B52;
      --rojo-terracota: #A43A2E;
      --linea-suave: #D1C7B7;
      --crema-oscuro: #DFD5C4;
      --blanco: #FFFFFF;
      --sombra-fuerte: rgba(42, 59, 82, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lato', sans-serif;
    }

    h1, h2, h3, h4, .panel h2 {
      font-family: 'Saira', sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent; 
    }

    /* --- CÁMARA AR --- */
    a-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* --- INTERFAZ SUPERIOR --- */
    .ar-ui-top { 
      position: fixed; 
      top: 20px; 
      left: 20px; 
      z-index: 99999; 
    }
    
    .back {
      background: var(--fondo-papel);
      color: var(--azul-marino);
      text-decoration: none;
      padding: 12px 20px;
      font-family: 'Saira', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.95em;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .back:active {
      transform: translateY(2px);
    }

    /* Oculto al inicio, se muestra al jugar */
    .progress {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
      background: var(--azul-marino);
      color: var(--fondo-papel);
      padding: 12px 20px;
      font-family: 'Saira', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.95em;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      display: none; 
    }

    /* --- PANEL DE MISIÓN INFERIOR --- */
    .panel {
      position: fixed;
      bottom: 24px;
      left: 24px;
      right: 24px;
      z-index: 99999;
      max-width: 450px;
      margin: 0 auto;
      background: var(--blanco);
      border: 1px solid var(--linea-suave);
      border-radius: 20px;
      padding: 30px 25px;
      text-align: center;
      box-shadow: 0 10px 30px var(--sombra-fuerte); 
    }

    .panel h2 {
      color: var(--rojo-terracota);
      font-size: 1.4em;
      text-transform: uppercase;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
    }

    .panel p {
      color: var(--azul-marino);
      font-size: 1.05em;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .estado {
      display: inline-block;
      background: var(--crema-oscuro);
      color: var(--rojo-terracota);
      font-family: 'Saira', sans-serif;
      font-weight: 900;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 16px;
      border: 1px solid var(--linea-suave);
      border-radius: 8px;
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
    }

    /* Estilo del botón nuevo adaptado al sistema de diseño */
    .btn-jugar {
      background: var(--rojo-terracota);
      color: var(--blanco);
      border: none;
      border-radius: 10px;
      padding: 16px 20px;
      font-family: 'Saira', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1.1em;
      cursor: pointer;
      position: relative;
      z-index: 2;
      margin-top: 10px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(164, 58, 46, 0.25);
      transition: all 0.2s ease;
    }

    .btn-jugar:hover {
      background-color: #8C2F24;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(164, 58, 46, 0.35);
    }

    .btn-jugar:active {
      transform: translateY(2px);
      box-shadow: 0 4px 10px rgba(164, 58, 46, 0.2);
    }
  </style>
</head>
<body>

  <div class="ar-ui-top">
    <a href="juegos-tipicos.html" class="back">❮ Salir</a>
  </div>

  <div class="progress" id="barra-progreso">
    Misión <span id="misionActual">1</span> de 6
  </div>

  <!-- PANEL PRINCIPAL DINÁMICO -->
  <div class="panel">
    
    <!-- PANTALLA INICIO -->
    <div id="pantalla-inicio">
      <h2>¡Descubre los juguetes!</h2>
      <p>Lee la pista que aparecerá aquí abajo y usa la cámara para escanear el juguete correcto.</p>
      <button class="btn-jugar" onclick="iniciarJuego()">Empezar Juego</button>
    </div>

    <!-- PANTALLA JUEGO (Oculta al inicio) -->
    <div id="pantalla-juego" style="display: none;">
      <h2>Busca la tarjeta</h2>
      <p id="texto-pista">Cargando pista...</p>
      <div class="estado" id="estado">Buscando...</div>
    </div>

    <!-- PANTALLA FINAL (Oculta al inicio) -->
    <div id="pantalla-final" style="display: none;">
      <h2 id="titulo-final">¡Felicidades!</h2>
      <div style="font-size: 2.2rem; margin: 5px 0; position: relative; z-index: 2;" id="estrellas-final">⭐⭐⭐</div>
      <p id="texto-final" style="margin-bottom: 5px;">Descubriste las 6 misiones.</p>
      <p id="texto-errores" style="font-size: 0.9em; margin-bottom: 15px;">0 intentos extra.</p>
      <button class="btn-jugar" onclick="iniciarJuego()">Volver a jugar</button>
    </div>

  </div>

  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <a-scene 
    mindar-image="imageTargetSrc: ./mind/juguetes.mind; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" detector-juego="trompo"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" detector-juego="volantin"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" detector-juego="emboque"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3" detector-juego="polcas"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4" detector-juego="rayuela"></a-entity>
    <a-entity mindar-image-target="targetIndex: 5" detector-juego="runrun"></a-entity>

  </a-scene>

</body>
</html>
