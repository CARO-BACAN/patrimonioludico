<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Patrimonio Lúdico - AR</title>
  
  <!-- Librerías de A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="js/datos.js"></script>

<!-- Tipografías de la marca: Saira (Títulos) y Lato (Textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Saira:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script>
    /* Componente para detectar cuál juguete está enfocado */
    AFRAME.registerComponent('detector-juguete', {
      schema: { type: 'string' },
      init: function () {
        const idJuguete = this.data;

        this.el.addEventListener('targetFound', () => {
          actualizarInfo(idJuguete);
          document.getElementById('info-card').classList.remove('oculto');
        });

        this.el.addEventListener('targetLost', () => {
          document.getElementById('info-card').classList.add('oculto');
          const content = document.getElementById('info-content');
          const arrow = document.getElementById('info-arrow');
          content.style.maxHeight = null;
          content.style.paddingBottom = "0px";
          arrow.style.transform = "rotate(0deg)";
        });
      }
    });
  </script>

  <style>
    :root {
      /* Paleta patrimonial del sistema de diseño */
      --fondo-papel: #EAE3D5;
      --azul-marino: #2A3B52;
      --rojo-terracota: #A43A2E;
      --linea-suave: #D1C7B7;
      --crema-oscuro: #DFD5C4;
      --blanco: #FFFFFF;
      --sombra-fuerte: rgba(42, 59, 82, 0.4);
    }
    
    /* Todo el texto base usará Lato por defecto */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Lato', sans-serif; 
    }

    /* Los títulos y elementos destacados usarán Saira */
    h1, h2, h3, h4, .info-header h2, .marca, .recursos-titulo, .guia-destacada h2, .acordeon-cabecera h4 {
      font-family: 'Saira', sans-serif;
      font-weight: 900; 
      letter-spacing: -0.5px;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Estilos personalizados para las guías de escaneo rectangulares (Proporción 9x14) */
    .mindar-ui-scanning .scanning {
      width: 60vw !important;
      height: 93.3vw !important;
      max-width: 240px !important;
      max-height: 373px !important;
      border: 2px dashed rgba(255, 255, 255, 0.8) !important;
      background: transparent !important;
      border-radius: 12px !important;
    }
    .mindar-ui-scanning .scanning-text {
      display: none !important;
    }

    /* Botones y UI superior */
    .ar-ui-top { 
      position: fixed; 
      top: 20px; 
      left: 20px; 
      z-index: 99999; 
    }
    
    .ar-btn, .btn-comenzar, .btn-secondary {
      font-family: 'Saira', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .ar-btn { 
      background-color: var(--fondo-papel); 
      color: var(--azul-marino); 
      padding: 12px 20px; 
      font-size: 0.95rem; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.25); 
    }

    .ar-btn:active { transform: translateY(2px); }

    /* Fondo difuminado moderno para el inicio */
    .fullscreen-overlay {
      position: fixed; 
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(42, 59, 82, 0.85); /* Azul marino translúcido */
      backdrop-filter: blur(5px); 
      -webkit-backdrop-filter: blur(5px);
      z-index: 9999999;
      display: flex; 
      justify-content: center; 
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    /* Tarjeta estilo sistema de diseño */
    .carga-card {
      background: var(--crema-oscuro);
      border: 1px solid var(--linea-suave);
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
      box-shadow: 0 15px 35px var(--sombra-fuerte);
      animation: popIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .icono-camara { font-size: 3rem; margin-bottom: 5px; }
    
    .carga-card h2 { 
      color: var(--rojo-terracota); 
      font-size: 1.6rem; 
      margin-bottom: 12px; 
      margin-top: 0; 
      text-transform: uppercase;
    }
    
    .carga-card p { 
      color: var(--azul-marino); 
      font-size: 1.05rem; 
      line-height: 1.5; 
      margin-bottom: 25px; 
    }

    .btn-comenzar {
      background-color: var(--rojo-terracota);
      color: var(--blanco);
      padding: 16px 24px;
      font-size: 1.1rem;
      width: 100%;
      box-shadow: 0 8px 20px rgba(164, 58, 46, 0.25);
    }
    
    .btn-comenzar:hover { background-color: #8C2F24; }
    .btn-comenzar:active { transform: translateY(2px); }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Tarjeta deslizable de información */
    .info-card {
      position: fixed; bottom: 24px; left: 24px; right: 24px;
      background: var(--blanco); 
      border-radius: 20px;
      border: 1px solid var(--linea-suave);
      box-shadow: 0 10px 30px var(--sombra-fuerte); 
      z-index: 99999;
      overflow: hidden; 
      transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s ease;
      max-width: 450px; 
      margin: 0 auto;
    }

    .info-card.oculto {
      transform: translateY(150%); opacity: 0; pointer-events: none;
    }

    .info-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 20px; 
      background: var(--crema-oscuro); 
      color: var(--rojo-terracota);
      cursor: pointer; user-select: none;
    }

    .info-header h2 { margin: 0; font-size: 1.3rem; text-transform: uppercase; }
    .info-arrow { font-size: 1.2rem; transition: transform 0.4s ease; color: var(--azul-marino); font-weight: bold; }

    .info-content {
      max-height: 0; overflow: hidden; background: var(--fondo-papel);
      transition: max-height 0.4s ease-out, padding 0.4s ease; padding: 0 20px;
    }

    .info-content p { 
      margin: 16px 0; 
      font-size: 1rem; 
      line-height: 1.5; 
      color: var(--azul-marino); 
    }
    
    .btn-secondary {
      width: 100%; 
      background-color: var(--azul-marino); 
      color: var(--blanco); 
      padding: 14px; 
      font-size: 0.95rem;
      margin-bottom: 20px; 
      box-shadow: 0 6px 15px rgba(42, 59, 82, 0.2);
    }
    
    .btn-secondary:active { transform: translateY(2px); }
  </style>
</head>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const accesoKit = sessionStorage.getItem("kit");
    if (!accesoKit) {
      window.location.href = "index.html";
    }
  });
</script>
<body>

  <!-- Pantalla de inicio para desbloquear la cámara -->
  <div id="pantalla-carga" class="fullscreen-overlay">
    <div class="carga-card">
      <div class="icono-camara">📸</div>
      <h2>¡Cámara lista!</h2>
      <p>Apunta con tu celular a las tarjetas de los juguetes para que cobren vida.</p>
      <button class="btn-comenzar" onclick="iniciarCamara()">Comenzar experiencia</button>
    </div>
  </div>

  <!-- Botón de salir -->
  <div class="ar-ui-top">
    <a href="juegos-tipicos.html" class="ar-btn">❮ Salir</a>
  </div>

  <!-- Tarjeta deslizable inferior -->
  <div id="info-card" class="info-card oculto">
    <div class="info-header" onclick="toggleInfo()">
      <h2 id="info-titulo">Juguete</h2>
      <span id="info-arrow" class="info-arrow">▲</span>
    </div>
    <div id="info-content" class="info-content">
      <p id="info-curiosidad">Acá va la curiosidad del juguete.</p>
      <button onclick="irARecursos()" class="btn-secondary">🖍 Ver actividades relacionadas</button>
    </div>
  </div>

  <!-- ESCENA DE REALIDAD AUMENTADA CON MINDAR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./mind/juguetes.mind; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="trompo-3d" src="glb/trompo.glb"></a-asset-item>
      <a-asset-item id="volantin-3d" src="glb/volantin.glb"></a-asset-item>
      <a-asset-item id="emboque-3d" src="glb/emboque.glb"></a-asset-item>
      <a-asset-item id="polcas-3d" src="glb/polcas.glb"></a-asset-item>
      <a-asset-item id="rayuela-3d" src="glb/rayuela.glb"></a-asset-item>
      <a-asset-item id="runrun-3d" src="glb/runrun.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<!-- 1. Luz Ambiental general mucho más potente para levantar las sombras internas -->
<!-- 1. Luz Ambiental sutil para levantar la base -->
<a-entity light="type: ambient; color: #ffffff; intensity: 1.8"></a-entity>

<!-- 2. Foco Principal Frontal (Key Light): Bajamos un poquito a 3.2 para que no queme -->
<a-entity light="type: directional; color: #ffffff; intensity: 3.2; castShadow: true;" position="0 5 4"></a-entity>

<!-- 3. Luz de Relleno Lateral Izquierda -->
<a-entity light="type: directional; color: #e6f2ff; intensity: 2.0" position="-3 3 2"></a-entity>

<!-- 4. Luz de Relleno Lateral Derecha -->
<a-entity light="type: directional; color: #fff5e6; intensity: 2.0" position="3 3 2"></a-entity>

<!-- 5. Contra trasera para mantener el brillo interno del vidrio -->
<a-entity light="type: directional; color: #ffffff; intensity: 2.8" position="0 3 -4"></a-entity>


    <!-- 1. Trompo (Índice 0) -->
    <a-entity mindar-image-target="targetIndex: 0" detector-juguete="trompo">
      <a-gltf-model src="#trompo-3d" position="0 0.4 0.06" scale="0.2 0.2 0.2" rotation="25 0 0"></a-gltf-model>
    </a-entity>
<!-- 2. Volantín (Índice 1) -->
<a-entity mindar-image-target="targetIndex: 1" detector-juguete="volantin">
      <a-gltf-model src="#volantin-3d" position="0 0 0" scale="1.3 1.3 1.3" rotation="0 0 0"></a-gltf-model>
</a-entity>

    <!-- 3. Emboque (Índice 2) -->
    <a-entity mindar-image-target="targetIndex: 2" detector-juguete="emboque">
      <a-gltf-model src="#emboque-3d" position="0 0.25 0" scale="0.2 0.2 0.2" rotation="25 0 0"></a-gltf-model>
    </a-entity>

<!-- 4. Polcas (Índice 3) -->
<a-entity mindar-image-target="targetIndex: 3" detector-juguete="polcas">
  <a-gltf-model 
    src="#polcas-3d" 
    position="0 0 0" 
    scale="0.2 0.2 0.2" 
    rotation="0 0 0"
    material="shader: standard; transparent: true; opacity: 0.6; roughness: 0.1; metalness: 0.1;"
  ></a-gltf-model>
</a-entity>

    <!-- 5. Rayuela (Índice 4) -->
    <a-entity mindar-image-target="targetIndex: 4" detector-juguete="rayuela">
      <a-gltf-model src="#rayuela-3d" position="0 0.1 0.05" scale="0.25 0.25 0.25" rotation="25 0 0"></a-gltf-model>
    </a-entity>

    <!-- 6. Run Run (Índice 5) -->
    <a-entity mindar-image-target="targetIndex: 5" detector-juguete="runrun">
      <a-gltf-model src="#runrun-3d" position="0 0 0" scale="0.1 0.1 0.1" rotation="0 0 0"></a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    // 1. Quitar la pantalla de inicio y activar la cámara
    function iniciarCamara() {
      document.getElementById('pantalla-carga').style.display = 'none';
    }

    // 2. Cargar los datos desde tu archivo datos.js
    function actualizarInfo(id) {
      if (typeof datosJuguetes !== 'undefined' && datosJuguetes[id]) {
        const info = datosJuguetes[id];
        document.getElementById('info-titulo').innerText = info.titulo;
        document.getElementById('info-curiosidad').innerText = info.curiosidad;
      }
    }

    // 3. Desplegar o contraer la tarjeta de curiosidad inferior
    function toggleInfo() {
      const content = document.getElementById('info-content');
      const arrow = document.getElementById('info-arrow');
      if (content.style.maxHeight && content.style.maxHeight !== "0px") {
        content.style.maxHeight = "0px";
        content.style.paddingBottom = "0px";
        arrow.style.transform = "rotate(0deg)";
      } else {
        content.style.maxHeight = content.scrollHeight + 50 + "px";
        content.style.paddingBottom = "20px";
        arrow.style.transform = "rotate(180deg)";
      }
    }

    function irARecursos() { 
      window.location.href = 'recursos.html'; 
    }
  </script>
</body>
</html>
