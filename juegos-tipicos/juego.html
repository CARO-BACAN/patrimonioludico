<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ColecciónAR - Juego</title>

  <!-- Tipografías de la marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Saira:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Scripts de misiones y lógica del juego -->
  <script src="js/misiones.js"></script>
  <script src="js/juego.js" defer></script>

  <script>
    /* Componente de A-Frame para conectar MindAR directamente con la función del juego */
    AFRAME.registerComponent('detector-juego', {
      schema: { type: 'string' },
      init: function () {
        const nombreJuguete = this.data;

        this.el.addEventListener('targetFound', () => {
          if (typeof window.escaneoCorrecto === 'function') {
            window.escaneoCorrecto(nombreJuguete);
          }
        });
      }
    });
  </script>


<style>
    :root {
      --fondo-papel: #EAE3D5;
      --azul-marino: #2A3B52;
      --rojo-terracota: #A43A2E;
      --linea-suave: #D1C7B7;
      --crema-oscuro: #DFD5C4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent; /* Permite que el video de la cámara se vea por detrás */
    }

    /* --- CÁMARA AR IDÉNTICA A ar.html --- */
    a-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* --- INTERFAZ FLOTANTE SUPERIOR --- */
    .ar-ui-top { 
      position: fixed; 
      top: 20px; 
      left: 20px; 
      z-index: 99999; 
    }
    
    .back {
      background: var(--fondo-papel);
      color: var(--azul-marino);
      text-decoration: none;
      padding: 10px 15px;
      font-family: 'Saira', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9em;
      border: 2px solid var(--azul-marino);
      box-shadow: 3px 3px 0px var(--azul-marino);
      display: inline-block;
    }

    .progress {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
      background: var(--azul-marino);
      color: var(--fondo-papel);
      padding: 10px 15px;
      font-family: 'Saira', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9em;
      border: 2px solid var(--azul-marino);
    }

    /* --- PANEL DE MISIÓN INFERIOR --- */
    .panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 99999;
      max-width: 450px;
      margin: 0 auto;
      background: var(--fondo-papel);
      border: 2px solid var(--rojo-terracota);
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid var(--rojo-terracota);
      pointer-events: none;
    }

    .panel h2 {
      font-family: 'Saira', sans-serif;
      color: var(--rojo-terracota);
      font-size: 1.2em;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .panel p {
      color: var(--azul-marino);
      font-size: 1em;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 15px;
      position: relative;
      z-index: 2;
    }

    .estado {
      display: inline-block;
      background: var(--crema-oscuro);
      color: var(--rojo-terracota);
      font-family: 'Saira', sans-serif;
      font-weight: 600;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 12px;
      border: 1px solid var(--linea-suave);
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Botón Salir -->
  <div class="ar-ui-top">
    <a href="index.html" class="back">❮ Salir</a>
  </div>

  <!-- Indicador de Progreso Superior Derecho -->
  <div class="progress">
    Misión <span id="misionActual">1</span>
  </div>

  <!-- Panel de Misión Inferior -->
  <div class="panel">
    <h2 id="titulo">Busca la primera tarjeta</h2>
    <p id="texto">Escanea cualquier tarjeta sobre la mesa para activar el juego y recibir tu primera pista.</p>
    <div class="estado" id="estado">Esperando cámara...</div>
  </div>

  <!-- ESCENA DE REALIDAD AUMENTADA IDÉNTICA A ar.html -->
  <a-scene 
    mindar-image="imageTargetSrc: ./mind/juguetes.mind; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" detector-juego="trompo"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" detector-juego="volantin"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" detector-juego="runrun"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3" detector-juego="emboque"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4" detector-juego="rayuela"></a-entity>
    <a-entity mindar-image-target="targetIndex: 5" detector-juego="polcas"></a-entity>

  </a-scene>

</body>
</html>
